<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>JavaCraft indev 0.0</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; }
    canvas { display: block; }

    #toggleMode {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 10px 20px;
      background-color: #ffffffcc;
      border: none;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="toggleMode">🌙 Night</button>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    // Cena, renderizador e câmera
    const scene = new THREE.Scene();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      75,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.set(0, 10, 10);
    camera.lookAt(0, 0, 0);

    // Luzes
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(5, 10, 5);
    scene.add(ambientLight, directionalLight);

    // Player
    const playerGeometry = new THREE.BoxGeometry(1, 1, 1);
    const playerMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
    const player = new THREE.Mesh(playerGeometry, playerMaterial);
    player.position.set(0, 0.5, 0);
    scene.add(player);

    // Cenário 4x4 (16 cubos)
    const cubeGeometry = new THREE.BoxGeometry(1, 1, 1);
    const cubeMaterial = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
    const spacing = 2;
    const size = 4;

    for (let x = 0; x < size; x++) {
      for (let z = 0; z < size; z++) {
        const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.position.set(
          (x - size / 2) * spacing,
          0.5,
          (z - size / 2) * spacing
        );

        if (cube.position.x === 0 && cube.position.z === 0) continue;
        scene.add(cube);
      }
    }

    // Chão
    const groundGeometry = new THREE.PlaneGeometry(20, 20);
    const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const ground = new THREE.Mesh(groundGeometry, groundMaterial);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Movimento do player
    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.key.toLowerCase()] = true;
    });

    window.addEventListener('keyup', (e) => {
      keys[e.key.toLowerCase()] = false;
    });

    const speed = 0.1;

    function handleMovement() {
      if (keys['w']) player.position.z -= speed;
      if (keys['s']) player.position.z += speed;
      if (keys['a']) player.position.x -= speed;
      if (keys['d']) player.position.x += speed;
    }

    // Modo Dia/Noite
    let isDay = true;
    const button = document.getElementById("toggleMode");

    button.addEventListener("click", () => {
      isDay = !isDay;

      if (isDay) {
        scene.background = new THREE.Color(0xbfd1e5); // Azul claro
        ambientLight.intensity = 0.6;
        directionalLight.intensity = 1;
        button.textContent = "🌙 Night";
      } else {
        scene.background = new THREE.Color(0x000000); // Preto
        ambientLight.intensity = 0.2;
        directionalLight.intensity = 0.4;
        button.textContent = "☀️ Morning";
      }
    });

    // Animação
    function animate() {
      requestAnimationFrame(animate);
      handleMovement();
      renderer.render(scene, camera);
    }

    animate();

    // Responsivo
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Começa no modo dia
    scene.background = new THREE.Color(0xbfd1e5);
  </script>
</body>
</html>
